services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dwmeliuz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DW_DB_PASSWORD:?Defina DW_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${DW_DB_PORT:-5432}:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      - ./database/postgresql/01_ddl_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/postgresql/02_views_analiticas.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dwmeliuz"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  dados:
